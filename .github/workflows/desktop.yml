name: Aplikacja na komputer
# Buduje instalatory gry na Windows, macOS i Linux (pliki do pobrania w zakładce Actions,
# sekcja Artifacts). Na gałęzi main uruchamia go workflow „Wydanie” (release.yml),
# który publikuje instalatory w zakładce Releases.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm test
      - name: Test aplikacji bez internetu (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - name: Test strony na telefonach (przeglądarka)
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          npm run test:web
      - name: Test aplikacji bez internetu
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Zbuduj instalatory
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: swiatelka-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

