name: Wydanie
# Po każdej zmianie na main buduje i testuje aplikacje na komputer (Windows, macOS, Linux).
# Jeśli wersji z package.json (np. 1.0.0) nie ma jeszcze w zakładce Releases,
# publikuje wydanie v1.0.0 ze wszystkimi plikami do pobrania.
# Nowe wydanie = podnieś "version" w package.json i scal zmianę do main.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Sprawdź, czy ta wersja ma już wydanie
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "Wydanie v$VERSION już istnieje — tylko budowanie i testy."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nowa wersja v$VERSION — zostanie opublikowana."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  desktop:
    uses: ./.github/workflows/desktop.yml
    permissions:
      contents: read

  publish:
    needs: [version, desktop]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Lista plików wydania
        run: |
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Światełka ${{ needs.version.outputs.version }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          body: |
            Gra w wygaszanie światełek — działa bez internetu.

            | System | Plik |
            |---|---|
            | Windows | `Swiatelka-${{ needs.version.outputs.version }}-instalator-windows.exe` (lub wersja bez instalacji) |
            | macOS | `Swiatelka-${{ needs.version.outputs.version }}-macos.dmg` |
            | Linux | `Swiatelka-${{ needs.version.outputs.version }}-linux-x86_64.AppImage` lub `.deb` |
            | Android | otwórz https://zbludzakowe-zabawy.github.io/swiatelka/ w Chrome → **Zainstaluj** |
            | iPhone / iPad | otwórz https://zbludzakowe-zabawy.github.io/swiatelka/ w Safari → Udostępnij → Do ekranu początkowego |

            Instrukcja instalacji: zobacz README.
